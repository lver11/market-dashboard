name: Test and Deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          echo "Running tests..."
          python -m pytest tests/ -v

      - name: Log test completion
        if: always()
        run: |
          echo "📝 Logging test completion..."
          
          DATE=$(date +'%Y-%m-%d %H:%M:%S')
          echo "" >> WORK_LOG.md
          echo "## 📅 $DATE" >> WORK_LOG.md
          echo "" >> WORK_LOG.md
          echo "### 작업 완료" >> WORK_LOG.md
          echo "**지시사항**: GitHub Actions 테스트 실행" >> WORK_LOG.md
          echo "" >> WORK_LOG.md
          echo "**작업 내용**:" >> WORK_LOG.md
          echo "- Test Job 실행 (pytest로 API 테스트)" >> WORK_LOG.md
          echo "- 테스트 결과 확인 (passed/failed)" >> WORK_LOG.md
          echo "" >> WORK_LOG.md
          echo "**결과**: ✅ 테스트 완료" >> WORK_LOG.md
          echo "" >> WORK_LOG.md
          echo "---" >> WORK_LOG.md

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    # Only deploy on push to main, not on pull requests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render
        run: |
          echo "Deploying to Render..."
          curl -X POST https://api.render.com/v1/services/srv-d6010l8gjchc739ngkbg/deploys \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'

          echo "Deploy triggered successfully!"

      - name: Log work completion
        if: always()
        run: |
          echo "📝 Logging work completion..."
          
          DATE=$(date +'%Y-%m-%d %H:%M:%S')
          echo "" >> WORK_LOG.md
          echo "## 📅 $DATE" >> WORK_LOG.md
          echo "" >> WORK_LOG.md
          echo "### 작업 완료" >> WORK_LOG.md
          echo "**지시사항**: GitHub Actions 테스트 및 배포 완료" >> WORK_LOG.md
          echo "" >> WORK_LOG.md
          echo "**작업 내용**:" >> WORK_LOG.md
          echo "- Test Job 완료 (pytest로 API 테스트 실행)" >> WORK_LOG.md
          echo "- Deploy Job 완료 (Render에 배포 트리거)" >> WORK_LOG.md
          echo "" >> WORK_LOG.md
          echo "**결과**: ✅ 테스트 통과 및 배포 완료" >> WORK_LOG.md
          echo "" >> WORK_LOG.md
          echo "---" >> WORK_LOG.md
