name: diag-fred
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for u in "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10" \
                   "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd=2025-01-01" \
                   "https://fred.stlouisfed.org/series/DGS10" \
                   "https://api.stlouisfed.org/fred/series/observations?series_id=DGS10&file_type=json" \
                   "https://api.bls.gov/publicAPI/v1/timeseries/data/LNS14000000" \
                   "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/2026/all?type=daily_treasury_yield_curve&field_tdr_date_value=2026&page&_format=csv" \
                   "https://api.db.nomics.world/v22/series/FED/H15/RIFLGFCY10_N.B?observations=1" ; do
            echo "== $u"
            curl -s -o /tmp/o -w "code=%{http_code} time=%{time_total}\n" -m 40 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36" "$u"
            head -c 300 /tmp/o; echo
          done
